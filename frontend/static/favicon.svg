<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>

  <!-- DNA helix style design -->
  <path d="M30 25 Q35 35 30 45 Q25 55 30 65 Q35 75 30 85"
        stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M70 25 Q65 35 70 45 Q75 55 70 65 Q65 75 70 85"
        stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Connection lines (DNA base pairs) -->
  <line x1="30" y1="35" x2="70" y2="35" stroke="#93c5fd" stroke-width="2"/>
  <line x1="30" y1="50" x2="70" y2="50" stroke="#93c5fd" stroke-width="2"/>
  <line x1="30" y1="65" x2="70" y2="65" stroke="#93c5fd" stroke-width="2"/>

  <!-- Small circles at connection points -->
  <circle cx="30" cy="35" r="3" fill="#dbeafe"/>
  <circle cx="70" cy="35" r="3" fill="#dbeafe"/>
  <circle cx="30" cy="50" r="3" fill="#dbeafe"/>
  <circle cx="70" cy="50" r="3" fill="#dbeafe"/>
  <circle cx="30" cy="65" r="3" fill="#dbeafe"/>
  <circle cx="70" cy="65" r="3" fill="#dbeafe"/>
</svg>
