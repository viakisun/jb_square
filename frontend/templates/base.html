<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}바이오 플랫폼 백오피스{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">바이오 플랫폼</h1>
                <div style="font-size: 12px; color: #999; margin-top: 4px;">백오피스</div>
            </div>

            <nav class="sidebar-nav">
                <a href="{{ url_for('dashboard') }}" class="nav-item">
                    <span class="nav-icon">🧭</span>
                    <span>대시보드</span>
                </a>
                <a href="{{ url_for('contents') }}" class="nav-item">
                    <span class="nav-icon">📰</span>
                    <span>콘텐츠 관리</span>
                </a>
                <a href="{{ url_for('organizations') }}" class="nav-item">
                    <span class="nav-icon">🏢</span>
                    <span>기업·기관 관리</span>
                </a>
                <a href="{{ url_for('analytics') }}" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span>통계 리포트</span>
                </a>
                <a href="{{ url_for('settings') }}" class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span>설정</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
