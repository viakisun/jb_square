{% extends "base.html" %}

{% block title %}설정 - 바이오 플랫폼 백오피스{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">설정</h1>
    <p class="page-subtitle">크롤링 소스 및 시스템 설정 관리</p>
</div>

<!-- Tabs -->
<div class="tabs">
    <button class="tab active" data-tab="crawling" onclick="switchTab('crawling')">크롤링 소스</button>
    <button class="tab" data-tab="users" onclick="switchTab('users')">권한 관리</button>
    <button class="tab" data-tab="system" onclick="switchTab('system')">시스템 설정</button>
</div>

<!-- Tab 1: 크롤링 소스 -->
<div id="tab-crawling" class="tab-content active">
    <div class="card">
        <h3 style="margin-bottom: 24px;">크롤링 소스 관리</h3>

        <div style="margin-bottom: 32px;">
            <h4 style="margin-bottom: 16px;">JBTP (전북테크노파크)</h4>
            <div class="form-group">
                <label class="form-label">활성화</label>
                <select class="form-select" style="width: 200px;">
                    <option value="true" selected>ON</option>
                    <option value="false">OFF</option>
                </select>
            </div>
            <button class="btn" onclick="alert('곧 구현 예정')">지금 실행</button>
        </div>

        <div style="margin-bottom: 32px;">
            <h4 style="margin-bottom: 16px;">NTIS (국가R&D)</h4>
            <div class="form-group">
                <label class="form-label">활성화</label>
                <select class="form-select" style="width: 200px;">
                    <option value="true" selected>ON</option>
                    <option value="false">OFF</option>
                </select>
            </div>
            <button class="btn" onclick="alert('곧 구현 예정')">지금 실행</button>
        </div>

        <div style="margin-bottom: 32px;">
            <h4 style="margin-bottom: 16px;">BizInfo (기업마당)</h4>
            <div class="form-group">
                <label class="form-label">활성화</label>
                <select class="form-select" style="width: 200px;">
                    <option value="true" selected>ON</option>
                    <option value="false">OFF</option>
                </select>
            </div>
            <button class="btn" onclick="alert('곧 구현 예정')">지금 실행</button>
        </div>

        <button class="btn btn-primary" onclick="alert('곧 구현 예정')">설정 저장</button>
    </div>
</div>

<!-- Tab 2: 권한 관리 -->
<div id="tab-users" class="tab-content">
    <div class="card">
        <p style="padding: 40px; text-align: center; color: #999;">권한 관리 기능은 곧 구현 예정입니다.</p>
    </div>
</div>

<!-- Tab 3: 시스템 설정 -->
<div id="tab-system" class="tab-content">
    <div class="card">
        <p style="padding: 40px; text-align: center; color: #999;">시스템 설정 기능은 곧 구현 예정입니다.</p>
    </div>
</div>
{% endblock %}
