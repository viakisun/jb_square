name: Deploy to EC2 with ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ECR_REGISTRY: 711678334703.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: jb-square
  AWS_REGION: ap-northeast-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Backend image
        run: |
          echo "🔨 Building backend image..."
          cd backend
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:backend-latest \
                       -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:backend-${{ github.sha }} .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:backend-latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:backend-${{ github.sha }}
          echo "✅ Backend image pushed"

      - name: Build and push Frontend-Main image
        run: |
          echo "🔨 Building frontend-main image..."
          cd frontend-main
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-main-latest \
                       -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-main-${{ github.sha }} .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-main-latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-main-${{ github.sha }}
          echo "✅ Frontend-main image pushed"

      - name: Build and push Frontend-Admin image
        run: |
          echo "🔨 Building frontend-admin image..."
          cd frontend-admin
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-admin-latest \
                       -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-admin-${{ github.sha }} .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-admin-latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-admin-${{ github.sha }}
          echo "✅ Frontend-admin image pushed"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure SSH
        run: |
          echo "🔐 Configuring SSH connection..."
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env file
        run: |
          echo "📝 Creating .env file..."
          cat > .env << EOF
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}
          AWS_DB_HOST=${{ secrets.AWS_DB_HOST }}
          AWS_DB_PORT=${{ secrets.AWS_DB_PORT }}
          AWS_DB_NAME=${{ secrets.AWS_DB_NAME }}
          AWS_DB_USER=${{ secrets.AWS_DB_USER }}
          AWS_DB_PASSWORD=${{ secrets.AWS_DB_PASSWORD }}
          FLASK_ENV=production
          FLASK_SECRET_KEY=${{ secrets.FLASK_SECRET_KEY }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          NTIS_API_KEY=${{ secrets.NTIS_API_KEY }}
          BIZINFO_API_KEY=${{ secrets.BIZINFO_API_KEY }}
          JBTP_API_KEY=${{ secrets.JBTP_API_KEY }}
          EOF

      - name: Copy files to EC2
        run: |
          echo "📦 Syncing files to EC2..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='backend/Dockerfile' \
            --exclude='frontend-main/Dockerfile' \
            --exclude='frontend-admin/Dockerfile' \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/jb_square/

          scp -i ~/.ssh/deploy_key .env ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/jb_square/.env

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            echo "=========================================="
            echo "🚀 Starting Deployment"
            echo "=========================================="

            cd /home/${{ secrets.EC2_USER }}/jb_square

            echo "🔐 Logging into ECR..."
            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin 711678334703.dkr.ecr.ap-northeast-2.amazonaws.com

            echo "📥 Pulling latest images from ECR..."
            docker pull 711678334703.dkr.ecr.ap-northeast-2.amazonaws.com/jb-square:backend-latest
            docker pull 711678334703.dkr.ecr.ap-northeast-2.amazonaws.com/jb-square:frontend-main-latest
            docker pull 711678334703.dkr.ecr.ap-northeast-2.amazonaws.com/jb-square:frontend-admin-latest

            echo "🔄 Restarting containers..."
            docker-compose -f docker-compose.prod.yml up -d --force-recreate

            echo "⏳ Waiting for services to start..."
            sleep 15

            echo "📊 Container status:"
            docker-compose -f docker-compose.prod.yml ps

            echo "🏥 Health check..."
            for i in {1..30}; do
              if docker exec jb2-backend-prod curl -f http://localhost:8000/health 2>/dev/null; then
                echo "✅ Backend is healthy"
                break
              fi
              echo "Waiting for backend... ($i/30)"
              sleep 2
            done

            echo "🧹 Cleaning up old Docker images..."
            # Remove dangling images (untagged)
            docker image prune -f

            # Remove old ECR images except the ones currently in use
            docker images --filter "reference=711678334703.dkr.ecr.ap-northeast-2.amazonaws.com/jb-square" --format "{{.Repository}}:{{.Tag}} {{.ID}}" | while read img id; do
              if ! docker ps --format "{{.Image}}" | grep -q "$id"; then
                if [[ ! "$img" =~ -latest$ ]]; then
                  echo "Removing unused image: $img"
                  docker rmi "$img" 2>/dev/null || true
                fi
              fi
            done

            echo "=========================================="
            echo "✅ Deployment Complete"
            echo "=========================================="
          EOF

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f .env

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Website: https://admin.jb2.kr"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check logs above for details"
