services:
  backend:
    image: 711678334703.dkr.ecr.ap-northeast-2.amazonaws.com/jb-square:backend-latest
    container_name: jb2-backend-prod
    environment:
      - AWS_DB_HOST=${AWS_DB_HOST}
      - AWS_DB_PORT=${AWS_DB_PORT}
      - AWS_DB_NAME=${AWS_DB_NAME}
      - AWS_DB_USER=${AWS_DB_USER}
      - AWS_DB_PASSWORD=${AWS_DB_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - NTIS_API_KEY=${NTIS_API_KEY}
      - BIZINFO_API_KEY=${BIZINFO_API_KEY}
      - JBTP_API_KEY=${JBTP_API_KEY:-}
    expose:
      - "8000"
    restart: always
    networks:
      - jb2-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend-main:
    image: 711678334703.dkr.ecr.ap-northeast-2.amazonaws.com/jb-square:frontend-main-latest
    container_name: jb2-frontend-main-prod
    environment:
      - NEXT_PUBLIC_API_URL=/api
    expose:
      - "3100"
    depends_on:
      - backend
    restart: always
    networks:
      - jb2-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend-admin:
    image: 711678334703.dkr.ecr.ap-northeast-2.amazonaws.com/jb-square:frontend-admin-latest
    container_name: jb2-frontend-admin-prod
    expose:
      - "80"
    depends_on:
      - backend
    restart: always
    networks:
      - jb2-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: jb2-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend-main
      - frontend-admin
    restart: always
    networks:
      - jb2-network

networks:
  jb2-network:
    driver: bridge